short_bio_text_justify: false
short_bio: >-
  <p>
    Hi! I’m Trang (/tɹaŋ/), a second-year PhD student in the Ecology, Evolution and Behavior program at UT Austin, where I work with <a href="https://daolab.weebly.com/" target="_blank">Dr. Phuong Dao</a>—one of the greatest supervisors I’ve had. 
  </p>
  <p>
    (Let me try to explain my research without making it sound too complicated), I’m interested in using AI to better understand plants and how they respond to their environments. 
    My current research explores whether vision-language models can distinguish between stress symptoms that look frustratingly similar in remote-sensing images of winter wheat. 
    In other words, I’m teaching AI to become a better plant detective. 🌾🔍
  </p>  
  <p>
    My current CV (updated September 4, 2026):

misc_text_justify: false
misc: >-
  <ul> <li>The name “melanthera-biflora” comes from <i>Melanthera biflora</i>, the scientific name of the sea daisy. Daisy is my English name, while “sea” is a nod to hydrology—the field where my scientific journey began.</li> <li>I adopted a cat to help with my anxiety, only to discover that he has anxiety too. Like cat, like owner.</li> <li>I love matcha, Sephora, and starting new side projects before finishing the previous ones.</li> </ul>

